name: mentora

x-mentora-env: &mentora-env
  MENTORA_DATABASE_URL: mongodb://mongo:27017/mentora
  MENTORA_REDIS_URL: redis://redis:6379/0
  MENTORA_LLM__BACKEND: ${MENTORA_LLM__BACKEND:-offline}
  MENTORA_HOSTED_LLM_API_KEY: ${MENTORA_HOSTED_LLM_API_KEY:-}
  MENTORA_PSEUDONYM_SALT: ${MENTORA_PSEUDONYM_SALT:-dev-only-salt}
  MENTORA_SESSION_SECRET: ${MENTORA_SESSION_SECRET:-dev-only-session-secret-change-me}
  MENTORA_JOBS__MODE: celery

services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    environment: *mentora-env
    ports: ["8000:8000"]
    volumes:
      - hfcache:/root/.cache/huggingface   # embedding / reranker / NLI models
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: .
    command: celery -A mentora.worker.celery_app worker --loglevel=info
    environment: *mentora-env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }

  # Dev Moodle for LTI 1.3 testing (M7). Opt-in: docker compose --profile lms up
  # Needs a Moodle checkout in ./lms/moodle (see docs/runbook.md). Moodle needs a SQL
  # database of its own; Mentora itself uses MongoDB.
  moodle-db:
    profiles: ["lms"]
    image: postgres:16
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - moodledb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      retries: 10

  moodle:
    profiles: ["lms"]
    image: moodlehq/moodle-php-apache:8.3
    ports: ["8080:80"]
    volumes:
      - ./lms/moodle:/var/www/html
      - moodledata:/var/www/moodledata
    depends_on:
      moodle-db: { condition: service_healthy }

volumes:
  mongodata:
  moodledb:
  moodledata:
  hfcache:
