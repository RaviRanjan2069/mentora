# Action catalogue v1 (FROZEN). The policy picks one action from this list; the LLM only
# phrases it. Any change needs a new catalogue version, because logged action ids,
# propensities and trained policies refer to it.
#
#   phases       SRL phases where the move is pedagogically meant to be used (a hint for
#                the rule policy; the safety filter does not restrict by phase)
#   styles       allowed styles; question-only moves are Socratic-only
#   needs_rag    the reply must be grounded in retrieved course passages
#   unsolicited  a tutor-initiated intervention; counts toward the load limit
#   why          the fixed "why this suggestion" text (never written by the LLM)
version: v1
why_prefix: "Why this suggestion:"

moves:
  # --- Planner (Forethought) -----------------------------------------------------------
  elicit_smart_goal:
    agent: Planner
    phases: [forethought]
    styles: [Socratic]
    needs_rag: false
    unsolicited: false
    description: Ask the learner to state a specific, measurable goal for this session.
    why: A specific goal for this session makes it easier to plan and to see your progress.
  decompose_plan:
    agent: Planner
    phases: [forethought]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: false
    description: Help break the goal into small, concrete steps.
    why: Breaking a goal into small steps makes it easier to start and to track.
  estimate_time:
    agent: Planner
    phases: [forethought]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: false
    description: Help estimate how long each step of the plan will take.
    why: Estimating time shows whether the plan fits the time you have.
  set_schedule:
    agent: Planner
    phases: [forethought]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: false
    description: Help decide when each step will be done.
    why: Deciding when you will do each step makes the plan more likely to happen.
  recall_past_goals:
    agent: Planner
    phases: [forethought]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: true
    description: Bring up the learner's earlier goals and ask how they went.
    why: Looking back at earlier goals helps you set a realistic one now.

  # --- Monitor (Performance) -----------------------------------------------------------
  confidence_check:
    agent: Monitor
    phases: [performance]
    styles: [Socratic]
    needs_rag: false
    unsolicited: true
    description: Before the learner answers, ask how confident they are (0 to 100 percent).
    why: Rating your confidence before answering helps you notice what you really know.
  progress_nudge:
    agent: Monitor
    phases: [performance]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: true
    description: Point out progress against the plan and ask about the next step.
    why: Checking progress against your plan keeps it on track.
  tactic_switch:
    agent: Monitor
    phases: [performance]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: true
    description: Suggest trying a different study tactic, such as practising after reading.
    why: Your recent study pattern has not changed for a while; a different tactic may work better.
  help_seeking_prompt:
    agent: Monitor
    phases: [performance]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: true
    description: Encourage seeking the right kind of help after a genuine attempt.
    why: Asking for the right help at the right time is part of learning well.
  break_suggestion:
    agent: Monitor
    phases: [performance]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: true
    description: Suggest a short break.
    why: You have been working for a while; a short break can help you focus.

  # --- ReflectionCoach (Self-reflection) -----------------------------------------------
  socratic_reflection:
    agent: ReflectionCoach
    phases: [reflection]
    styles: [Socratic]
    needs_rag: false
    unsolicited: false
    description: Ask open questions about what went well and what was hard.
    why: Thinking about how the task went helps you learn from it.
  attribution_question:
    agent: ReflectionCoach
    phases: [reflection]
    styles: [Socratic]
    needs_rag: false
    unsolicited: false
    description: Ask what the learner thinks caused the result (strategy, effort, understanding).
    why: Linking results to strategies you control helps you decide what to change.
  compare_outcome_goal:
    agent: ReflectionCoach
    phases: [reflection]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: false
    description: Compare the outcome with the session goal.
    why: Comparing what happened with your goal shows how close you got.
  record_lesson:
    agent: ReflectionCoach
    phases: [reflection]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: false
    description: Help write down one lesson to use next time.
    why: Writing down one lesson makes it easier to use next time.

  # --- ContentTutor (Performance) ------------------------------------------------------
  graded_hint:
    agent: ContentTutor
    phases: [performance]
    styles: [Socratic, Directive]
    needs_rag: true
    unsolicited: false
    description: Give the next smallest hint towards the solution, never the answer.
    why: A small hint can help you take the next step yourself.
  worked_example:
    agent: ContentTutor
    phases: [performance]
    styles: [Socratic, Directive]
    needs_rag: true
    unsolicited: false
    description: Walk through a similar (not the same) example that shows the method.
    why: Seeing a similar problem worked through can show you the method.
  concept_explanation:
    agent: ContentTutor
    phases: [performance]
    styles: [Socratic, Directive]
    needs_rag: true
    unsolicited: false
    description: Explain the underlying concept using the course passages.
    why: This concept seems to be the sticking point, so an explanation may help.
  practice_item:
    agent: ContentTutor
    phases: [performance]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: false
    description: Offer a practice question on the target concept.
    why: Practising this concept helps you check and strengthen your understanding.
  textbook_link:
    agent: ContentTutor
    phases: [performance]
    styles: [Socratic, Directive]
    needs_rag: true
    unsolicited: false
    description: Point the learner to the course section that covers this.
    why: The course material covers this; reading that section may help.

  # --- PeerBroker (all phases) ---------------------------------------------------------
  suggest_partner:
    agent: PeerBroker
    phases: [forethought, performance, reflection]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: true
    description: Suggest working through this with a classmate.
    why: Working with a classmate can help when you are stuck.
  suggest_thread:
    agent: PeerBroker
    phases: [forethought, performance, reflection]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: true
    description: Point to a course forum thread on this topic.
    why: Other students have discussed this topic in the course forum.
  share_peer_strategy:
    agent: PeerBroker
    phases: [forethought, performance, reflection]
    styles: [Socratic, Directive]
    needs_rag: false
    unsolicited: true
    description: Share a study strategy that other students found useful (anonymised).
    why: Other students found this strategy useful for this topic.
