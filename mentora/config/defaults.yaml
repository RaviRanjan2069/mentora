# Mentora defaults. Every tunable number lives here, never in code (design rule 10).
# Override any value with an env var: MENTORA_<SECTION>__<KEY>, e.g. MENTORA_SAFETY__THETA_PRE=0.6

app:
  name: Mentora
  # adaptive = full system; static = control arm of the study
  # (same agents, RAG and UI, fixed rule policy, no memory)
  mode: adaptive
  concepts_file: data/concepts.yaml

llm:
  backend: auto            # auto (hosted if an API key is set, else offline) | offline | hosted | local | fake (tests)
  hosted_model: claude-opus-5-5
  hosted_effort: medium    # low | medium | high | xhigh | max (thinking depth / token spend)
  hosted_fallbacks: true   # server-side refusal fallback ("default" routing)
  local_model: llama3.2:3b   # small enough to answer in real time on a laptop CPU
  local_temperature: 0.2
  # When the local model server cannot be reached: none (the turn fails) | offline (template
  # replies, shown as "Demo mode"); the model is tried again after local_retry_after_s.
  local_fallback: none
  local_retry_after_s: 60
  max_tokens: 16000        # per reply ceiling; includes thinking tokens on hosted models
  timeout_s: 60
  max_retries: 2
  retry_backoff_s: 1.0     # exponential: backoff * 2^attempt
  schema_repair_attempts: 1
  cache_enabled: false     # on-disk response cache (tests and replays)
  cache_dir: llm_cache
  # USD per 1M tokens, for cost logging. Local models cost 0.
  pricing:
    claude-opus-5-5: { input: 4.0, output: 20.0 }
    claude-opus-5: { input: 5.0, output: 25.0 }
    claude-opus-4-8: { input: 5.0, output: 25.0 }
    claude-sonnet-5-5: { input: 2.0, output: 10.0 }
    claude-haiku-5-5: { input: 0.1, output: 0.5 }

rag:
  chunk_tokens: 300
  beta: 0.4                # hybrid score = beta*minmax(BM25) + (1-beta)*cosine
  top_k_retrieve: 20
  top_k_rerank: 4
  chunk_overlap_tokens: 40
  embedder: sentence_transformers      # sentence_transformers | hashing (offline, tests)
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_dim: 384
  reranker: cross_encoder              # cross_encoder | lexical (offline, tests)
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  grounding_judge: nli                 # nli | llm | lexical (offline, tests)
  nli_model: cross-encoder/nli-deberta-v3-small
  lexical_entailment_threshold: 0.6    # share of a sentence's content words found in its cited passages
  max_regenerations: 1
  uncertain_reply: "I am not certain about this; I have asked your teacher."
  # A literal question whose content words barely overlap the best passages is off-topic.
  offtopic_overlap: 0.25
  offtopic_reply: "That seems to be outside this course's material, so I can't answer it here. If it matters for the course, ask your teacher."
  # open: any question gets a genuine answer (course notes cited when they help, otherwise a
  # general-knowledge answer shown with a "not from your course notes" label).
  # course_only: questions outside the notes get offtopic_reply (needs no model).
  answer_mode: open
  # When a reply cannot be verified against the cited notes after regenerating:
  # label (show it marked "not verified against your notes") | escalate (uncertain_reply + teacher).
  unverified: label
  answer_max_tokens: 500
  history_messages: 6        # earlier chat messages sent along so follow-up questions work
  answer_passages: 3         # course passages given with a question (fewer = faster on CPU)
  answer_regenerations: 1    # retries when cited notes do not support the answer (0 = label)

memory:
  recall_k: 5
  curator_gate: 0.6
  merge_cosine: 0.9
  prune_delta: 3           # prune if n_minus - n_plus > delta
  q_min: 0.2
  recency_half_life_days: 30
  max_candidates: 5        # reflector proposals per session
  reflector_mode: auto     # auto (llm with the hosted model, else heuristic) | llm | heuristic
  min_specific_words: 6
  # specific, evidenced, non-sensitive, not instruction-like (the last three are also vetoes)
  curator_weights: [0.45, 0.25, 0.15, 0.15]

jobs:
  mode: inline             # inline (run end-of-session jobs in the API process) | celery

safety:
  theta_pre: 0.5           # prerequisite mastery threshold for practice_item
  n_max: 3                 # max unsolicited interventions ...
  window_minutes: 15       # ... per window
  max_solution_code_lines: 4   # longer code in a reply to a graded item counts as a full solution
  integrity_regenerations: 1
  escalate_reply: "I've asked your teacher to look at this with you. They will get back to you."
  distress_reply: >-
    It sounds like things are hard right now, and you don't have to deal with it alone.
    I've let your teacher know. You can also reach out to someone right away:
  # Shown with every distress escalation. VERIFY before the pilot; add the university's own contacts.
  support_resources:
    - "Sharda University student counselling service (add the campus contact before the pilot)"
    - "Tele-MANAS, India's national mental health helpline: 14416 or 1-800-891-4416 (free, 24x7)"
    - "If you are in immediate danger, call 112."
  integrity_fallback_reply: >-
    Let's work through this together without giving away the answer.
    What have you tried so far, and where did it stop making sense?

agents:
  max_reply_sentences: 5

learner_model:
  calibration_eta: 0.2
  calibration_init: 0.5    # c-bar before the first confidence rating
  hmm_states_min: 3
  hmm_states_max: 6
  hmm_iterations: 100
  hmm_restarts: 5          # random initialisations per H (EM finds local optima)
  indicator_window: 10     # w: turns for SRL indicator counts
  tagger_mode: auto        # auto (llm with the hosted model, else trace_only) | llm | trace_only
  mastery_model: count     # count | dkt | akt  (dkt/akt need a trained model in model_dir)
  model_dir: models
  count_prior: [1.0, 1.0]  # Beta(a, b) prior for count-based mastery
  kt_hidden: 64
  kt_heads: 4
  kt_epochs: 12
  kt_lr: 0.003
  kt_batch_size: 32
  kt_test_fraction: 0.2    # held-out learners
  kt_seed: 7
  sdl_thresholds: [0.25, 0.5, 0.75]   # share of learner-initiated SRL actions -> Grow stage 1..4
  idle_minutes: 5          # gaps longer than this count as idle, not time on task
  engagement_window_days: 14
  dropout_weights: { bias: -0.5, sessions_per_week: -0.8, time_on_task_hours: -0.3, idle_ratio: 2.0 }
  norm_sessions_per_week: 7     # feature scaling for the state vector
  norm_time_on_task_hours: 10

policy:
  mode: collect            # collect (safe softmax inside F(s), logs propensities) | deploy (argmax)
  # Softmax temperature around the proposer's choice. With ~40 feasible actions, T=0.2 gives the
  # preferred action about 80% probability; the rest is spread thinly over F(s).
  collect_temperature: 0.2
  # When a learner explicitly asks (hint, example, explanation, practice question, answer),
  # give them the proposer's choice instead of exploring. Set true to explore everywhere.
  explore_on_requests: false
  confidence_check_every: 3   # ask for a confidence rating before every k-th item (1st, 4th, ...)
  novelty_beta: 0.1
  n_state_clusters: 8
  ensemble_m: 5
  kappa: 1.0
  tau_u: null              # set from validation data at M8
  gamma: 0.95
  seed: 42

reward:
  # Placeholder weights; frozen per policy version (see docs/decisions.md).
  lambda_k: 1.0
  lambda_s: 0.5
  lambda_g: 1.0
  lambda_d: 0.5
  lambda_l: 0.5
  omega: 0.2
  action_cost: 0.01
  escalate_cost: 0.2

offline:
  method: cql_ensemble     # cql_ensemble | tabular
  hidden: 64
  epochs: 40
  batch_size: 128
  lr: 0.001
  cql_alpha: 1.0           # weight of the conservative penalty
  target_tau: 0.05         # soft target-network update
  tau_u_quantile: 0.95     # tau_u = this quantile of ensemble std on validation states
  tabular_min_visits: 3    # tabular policy only trusts (cluster, action) pairs seen this often
  val_fraction: 0.2        # held-out learners
  min_episodes: 20         # fewer logged sessions than this: do not train
  fqe_iterations: 15
  ridge_alpha: 1.0
  weight_clip: 20.0        # importance-weight cap in doubly robust OPE
  # Gate: the candidate's per-decision effective sample size must be at least this share of the
  # evaluation steps, otherwise its OPE estimate is mostly model extrapolation.
  min_ess_fraction: 0.1
  bootstrap: 200           # learner-level bootstrap resamples
  lcb_alpha: 0.05          # one-sided lower confidence bound
  sim_sessions: 40         # simulated sessions for the constraint check
  sim_turns: 18
  fairness_min_group_episodes: 5

goals:
  attain_mastery: 0.7      # a goal concept counts as mastered at this mastery level
  quiz_max_attempts: 3

privacy:
  retention_days: 365

escalation:
  target_rate: 0.05        # target: at most 5% of turns escalated
