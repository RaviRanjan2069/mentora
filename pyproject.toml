[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mentora"
version = "0.1.0"
description = "Mentora: a Self-Learning Strategy Agent that tutors self-regulated learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "celery>=5.4",
    "redis>=5",
    "httpx>=0.27",
    "anthropic>=1.15",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pypdf>=5",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
# Heavy ML stack (real embeddings, reranker, NLI judge, KT). Tests never need it.
ml = [
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "hmmlearn>=0.3",
    "scikit-learn>=1.5",
]

[tool.setuptools.packages.find]
include = ["mentora*"]

[tool.setuptools.package-data]
"mentora.config" = ["*.yaml"]
"mentora.api" = ["static/*"]
"mentora.policy" = ["*.yaml"]
"mentora.safety" = ["*.yaml"]
"mentora" = ["prompts/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # word lists as split strings read better than long literals

[tool.ruff.lint.per-file-ignores]
# Question templates hold whole code snippets as one-line strings; splitting them hurts.
"mentora/question_bank.py" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["mentora"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "celery.*", "rank_bm25.*", "pptx.*", "sentence_transformers.*", "hmmlearn.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a live PostgreSQL with pgvector (run in CI or docker compose)",
    "models: needs downloaded ML models (sentence-transformers); run with -m models",
]
addopts = "-m 'not postgres and not models'"
