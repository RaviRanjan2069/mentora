name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check mentora tests scripts alembic
          ruff format --check mentora tests scripts alembic
      - name: Types
        run: mypy mentora scripts
      - name: Tests (offline, SQLite, FakeLLM)
        run: pytest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mentora
          POSTGRES_PASSWORD: mentora
          POSTGRES_DB: mentora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mentora" --health-interval 5s --health-retries 10
    env:
      MENTORA_DATABASE_URL: postgresql+psycopg://mentora:mentora@localhost:5432/mentora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrations and pgvector round-trip
        run: pytest -m postgres
