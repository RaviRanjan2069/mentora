name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # recognises ES module syntax in .js files
      - name: Syntax-check the web app (plain JavaScript modules, no build)
        run: for f in $(find frontend/js -name "*.js"); do node --check "$f"; done

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The ml extra (CPU-only torch) is needed for type-checking and the KT/offline tests.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,ml]"
      - name: Lint
        run: |
          ruff check mentora tests scripts
          ruff format --check mentora tests scripts
      - name: Types
        run: mypy mentora scripts
      - name: Tests (offline, in-memory MongoDB, FakeLLM)
        run: pytest

  mongo:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-retries 10
    env:
      MENTORA_TEST_MONGODB_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Indexes, round-trip and cascades on a real MongoDB
        run: pytest -m mongo tests/mongo
